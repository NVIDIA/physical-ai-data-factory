# Defect Image Generation — Glass Dataset Setup
#
# Stages the phone-screen defect dataset used by the glass flow. Masks and the
# defect spec come from Hugging Face; images come from the user-supplied
# Roboflow COCO zip. Fine-tuned AnomalyGen checkpoints are not distributed.
#
# Upload the zip as <uc3_zip_url_root>/mobile_screen.zip before submission.

version: 2
workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
    queue_timeout: "{{ queue_timeout }}"

  resources:
    cpu-download:
      cpu: "{{ cpu }}"
      memory: "{{ memory }}"
      storage: "{{ storage }}"
      platform: "{{ platform }}"

  groups:
    - name: download-glass-data
      tasks:
        - name: glass-data
          lead: true
          image: "{{ anomalygen_image }}"
          resource: cpu-download
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            HF_HUB_DISABLE_PROGRESS_BARS: "1"
            UC3_ZIP_DIR: "{{input:0}}"
          inputs:
            - url: "{{ uc3_zip_url_root }}"
          command: ["bash"]
          args: ["/tmp/run.sh"]
          files:
            - path: /tmp/run.sh
              contents: |
                set -euo pipefail
                OUT="{{output}}"
                ZIP="$UC3_ZIP_DIR/mobile_screen.zip"
                test -f "$ZIP" || {
                  echo "ERROR: expected mobile_screen.zip under $UC3_ZIP_DIR" >&2
                  exit 1
                }
                cd /workspace/paidf-anomalygen
                python -m anomalygen.scripts.datasets.prepare_phone_screen_defect \
                  --output_dir "$OUT" --zip "$ZIP"
                if [[ -d "$OUT/.cache" ]]; then
                  find "$OUT/.cache" -depth -delete
                fi
                if [[ -e "$OUT/.gitattributes" ]]; then
                  unlink "$OUT/.gitattributes"
                fi
                test -s "$OUT/defect_spec.jsonl"
                find "$OUT" -type f -path "*/anomaly_image/*/*" -print -quit | grep -q .
                find "$OUT" -type f -path "*/mask/*/*" -print -quit | grep -q .
          outputs:
            - url: "{{ dig_url_root }}/datasets/glass/raw"

default-values:
  workflow_name: setup_glass
  exec_timeout: 1h
  queue_timeout: 1h
  dig_url_root: "s3://osmo-workflows/dig"
  uc3_zip_url_root: ""
  anomalygen_image: "nvcr.io/nvidia/paidf-anomalygen:1.1.0"
  cpu: "2"
  memory: 8Gi
  storage: 20Gi
  platform: default
