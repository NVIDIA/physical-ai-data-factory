# Defect Image Generation — Metal Surface Dataset Setup
#
# Stages the curated Magnetic Tile training dataset. Fine-tuned AnomalyGen
# checkpoints are deliberately not distributed.

version: 2
workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
    queue_timeout: "{{ queue_timeout }}"

  resources:
    cpu-download:
      cpu: "{{ cpu }}"
      memory: "{{ memory }}"
      storage: "{{ storage }}"
      platform: "{{ platform }}"

  groups:
    - name: download-metal-surface-data
      tasks:
        - name: metal-surface-data
          lead: true
          image: "{{ anomalygen_image }}"
          resource: cpu-download
          credentials:
          command: ["bash"]
          args: ["/tmp/run.sh"]
          files:
            - path: /tmp/run.sh
              contents: |
                set -euo pipefail
                OUT="{{output}}"
                cd /workspace/paidf-anomalygen
                python -m anomalygen.scripts.datasets.prepare_magnetic_tile_defect --output_dir "$OUT"
                test -s "$OUT/defect_spec.jsonl"
                find "$OUT" -type f -path "*/anomaly_image/*/*" -print -quit | grep -q .
                find "$OUT" -type f -path "*/mask/*/*" -print -quit | grep -q .
          outputs:
            - url: "{{ dig_url_root }}/datasets/metal_surface/raw"

default-values:
  workflow_name: setup_metal
  exec_timeout: 1h
  queue_timeout: 1h
  dig_url_root: "s3://osmo-workflows/dig"
  anomalygen_image: "nvcr.io/nvidia/paidf-anomalygen:1.1.0"
  cpu: "2"
  memory: 8Gi
  storage: 20Gi
  platform: default
