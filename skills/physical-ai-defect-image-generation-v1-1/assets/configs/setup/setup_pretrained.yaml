# Defect Image Generation — Cosmos3 Base Checkpoint Setup
#
# Downloads the base assets required by AnomalyGen 1.1. This is not a
# use-case-specific fine-tuned checkpoint: generation workflows always train
# their own LoRA adapter.

version: 2
workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
    queue_timeout: "{{ queue_timeout }}"

  resources:
    cpu-download-large:
      cpu: "{{ cpu_large }}"
      memory: "{{ memory_large }}"
      storage: "{{ storage_large }}"
      platform: "{{ platform }}"

  groups:
    - name: download-cosmos3-base
      tasks:
        - name: cosmos3-base
          lead: true
          image: "{{ anomalygen_image }}"
          resource: cpu-download-large
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            HF_HUB_DISABLE_PROGRESS_BARS: "1"
          command: ["bash"]
          args: ["/tmp/run.sh"]
          files:
            - path: /tmp/run.sh
              contents: |
                set -euo pipefail
                OUT="{{output}}"
                mkdir -p "$OUT"
                cd /workspace/paidf-anomalygen
                # The pinned image predates its current torch-generated Edge DCP bytes.
                # Keep the immutable Hub manifest; regenerate only the local-conversion manifest.
                if [[ -e assets/checkpoint_manifest_converted.sha256 ]]; then
                  unlink assets/checkpoint_manifest_converted.sha256
                fi
                CKPT_DIR="$OUT" bash scripts/download_checkpoints.sh
                cp assets/checkpoint_manifest_converted.sha256 "$OUT/"
                test -d "$OUT/Cosmos3-Nano"
                test -d "$OUT/Cosmos3-Edge"
                test -s "$OUT/checkpoint_manifest_converted.sha256"
                test -f "$OUT/wan2pt2/Wan2.2_VAE.pth"
                find "$OUT" -type f -print -quit | grep -q .
          outputs:
            - url: "{{ dig_url_root }}/models/pretrained"

default-values:
  workflow_name: setup_pretrained
  exec_timeout: 6h
  queue_timeout: 2h
  dig_url_root: "s3://osmo-workflows/dig"
  anomalygen_image: "nvcr.io/nvidia/paidf-anomalygen:1.1.0"
  cpu_large: "8"
  memory_large: 64Gi
  storage_large: 300Gi
  platform: default
