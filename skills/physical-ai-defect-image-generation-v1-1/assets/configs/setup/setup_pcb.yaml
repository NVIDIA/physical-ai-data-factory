# Defect Image Generation — PCB Dataset and USD Setup
#
# Stages the raw PCB training dataset and USD assets. Fine-tuned AnomalyGen
# checkpoints are deliberately not distributed; every generation workflow
# trains a Cosmos3 adapter from this raw dataset.

version: 2
workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
    queue_timeout: "{{ queue_timeout }}"

  resources:
    cpu-download:
      cpu: "{{ cpu }}"
      memory: "{{ memory }}"
      storage: "{{ storage }}"
      platform: "{{ platform }}"

  groups:
    - name: download-pcb-data
      tasks:
        - name: pcb-data
          lead: true
          image: "{{ anomalygen_image }}"
          resource: cpu-download
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            HF_HUB_DISABLE_PROGRESS_BARS: "1"
          command: ["bash"]
          args: ["/tmp/run.sh"]
          files:
            - path: /tmp/run.sh
              contents: |
                set -euo pipefail
                OUT="{{output}}"
                cd /workspace/paidf-anomalygen
                python -m anomalygen.scripts.datasets.prepare_pcb_defect --output_dir "$OUT"
                if [[ -d "$OUT/.cache" ]]; then
                  find "$OUT/.cache" -depth -delete
                fi
                if [[ -e "$OUT/.gitattributes" ]]; then
                  unlink "$OUT/.gitattributes"
                fi
                test -s "$OUT/defect_spec.jsonl"
                find "$OUT" -type f -path "*/anomaly_image/*/*" -print -quit | grep -q .
                find "$OUT" -type f -path "*/mask/*/*" -print -quit | grep -q .
          outputs:
            - url: "{{ dig_url_root }}/datasets/pcb/raw"

    - name: download-pcb-assets
      tasks:
        - name: pcb-assets
          lead: true
          image: "{{ anomalygen_image }}"
          resource: cpu-download
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            HF_HUB_DISABLE_PROGRESS_BARS: "1"
          command: ["bash"]
          args: ["/tmp/run.sh"]
          files:
            - path: /tmp/run.sh
              contents: |
                set -euo pipefail
                OUT="{{output}}"
                mkdir -p "$OUT"
                hf download nvidia/Spark-AnomalyGen-USD --repo-type dataset --local-dir "$OUT"
                if [[ -d "$OUT/.cache" ]]; then
                  find "$OUT/.cache" -depth -delete
                fi
                if [[ -e "$OUT/.gitattributes" ]]; then
                  unlink "$OUT/.gitattributes"
                fi
                find "$OUT" -type f -print -quit | grep -q .
          outputs:
            - url: "{{ dig_url_root }}/datasets/pcb/assets"

default-values:
  workflow_name: setup_pcb
  exec_timeout: 2h
  queue_timeout: 1h
  dig_url_root: "s3://osmo-workflows/dig"
  anomalygen_image: "nvcr.io/nvidia/paidf-anomalygen:1.1.0"
  cpu: "2"
  memory: 8Gi
  storage: 50Gi
  platform: default
