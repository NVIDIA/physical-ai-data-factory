# Day 1 manual-ROI AnomalyGen 1.1 workflow.
#
# Raw dataset -> Cosmos3 finetune -> AMP generation -> SDG -> COCO and
# classification pseudo-labels. The raw artifact must include defect_spec.jsonl.

version: 2
workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
    queue_timeout: "{{ queue_timeout }}"

  resources:
    gpu-train:
      gpu: "{{ train_gpu }}"
      cpu: "{{ train_cpu }}"
      memory: "{{ train_memory }}"
      storage: "{{ train_storage }}"
      platform: "{{ platform }}"
    gpu-infer:
      gpu: "{{ infer_gpu }}"
      cpu: "{{ infer_cpu }}"
      memory: "{{ infer_memory }}"
      storage: "{{ infer_storage }}"
      platform: "{{ platform }}"

  groups:
    {% if not existing_finetune_url %}
    - name: finetune-job
      tasks:
        - name: finetune
          lead: true
          image: "{{ anomalygen_image }}"
          resource: gpu-train
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            NUM_GPUS: "{{ train_gpu }}"
            PRETRAINED_SRC: "{{input:0}}"
            DATASET_DIR: "{{input:1}}"
            RECIPE_TEMPLATE: /tmp/ag_config_template.yaml
            TRAIN_OUTPUT: "{{output}}"
          inputs:
            - url: "{{ dig_url_root }}/models/pretrained"
            - url: "{{ dig_url_root }}/datasets/{{ usecase }}/raw"
          command: ["bash"]
          args: ["/tmp/anomalygen_train.sh"]
          files:
            - localpath: ../cookbooks/{{ usecase }}/ag_config.yaml
              path: /tmp/ag_config_template.yaml
            - localpath: ../../scripts/anomalygen_train.sh
              path: /tmp/anomalygen_train.sh
          outputs:
            - url: "{{ dig_url_root }}/runs/{{ name }}/finetune"
    {% endif %}

    - name: anomaly-infer
      tasks:
        - name: infer-and-label
          lead: true
          image: "{{ anomalygen_image }}"
          resource: gpu-infer
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            PRETRAINED_SRC: "{{input:1}}"
            DATASET_DIR: "{{input:0}}"
            DEFECT_SPEC: "{{input:0}}/defect_spec.jsonl"
            FINETUNE_DIR: "{{input:2}}"
            OUTPUT_DIR: "{{output}}"
            NUM_SDG: "{{ num_sdg }}"
            NUM_GPUS: "{{ infer_gpu }}"
            CHECKPOINT_STEP: "{{ checkpoint_step }}"
          inputs:
            - url: "{{ dig_url_root }}/datasets/{{ usecase }}/raw"
            - url: "{{ dig_url_root }}/models/pretrained"
            {% if existing_finetune_url %}
            - url: "{{ existing_finetune_url }}"
            {% else %}
            - task: finetune
            {% endif %}
          command: ["bash"]
          args: ["/tmp/anomalygen_generate.sh"]
          files:
            - localpath: ../../scripts/anomalygen_generate.sh
              path: /tmp/anomalygen_generate.sh
          outputs:
            - url: "{{ dig_url_root }}/runs/{{ name }}/anomaly"

default-values:
  workflow_name: texture_defect_gen_day1_manual_roi
  exec_timeout: 32h
  queue_timeout: 2h
  dig_url_root: "s3://osmo-workflows/dig"
  usecase: pcb
  num_sdg: "30"
  existing_finetune_url: ""
  checkpoint_step: ""
  anomalygen_image: "nvcr.io/nvidia/paidf-anomalygen:1.1.0"
  train_gpu: "1"
  train_cpu: "16"
  train_memory: 96Gi
  train_storage: 300Gi
  infer_gpu: "1"
  infer_cpu: "8"
  infer_memory: 96Gi
  infer_storage: 250Gi
  platform: default
