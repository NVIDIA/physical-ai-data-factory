# AnomalyGen 1.1 finetune-only workflow.
#
# Always trains a Cosmos3 adapter from the selected raw dataset. No
# use-case-specific pretrained AnomalyGen checkpoints are consumed or emitted
# by setup workflows.

version: 2
workflow:
  name: "{{ workflow_name }}"
  timeout:
    exec_timeout: "{{ exec_timeout }}"
    queue_timeout: "{{ queue_timeout }}"

  resources:
    gpu-train:
      gpu: "{{ train_gpu }}"
      cpu: "{{ train_cpu }}"
      memory: "{{ train_memory }}"
      storage: "{{ train_storage }}"
      platform: "{{ platform }}"

  groups:
    - name: finetune-job
      tasks:
        - name: finetune
          lead: true
          image: "{{ anomalygen_image }}"
          resource: gpu-train
          credentials:
            hf-token:
              HF_TOKEN: token
          environment:
            NUM_GPUS: "{{ train_gpu }}"
            PRETRAINED_SRC: "{{input:0}}"
            DATASET_DIR: "{{input:1}}"
            RECIPE_TEMPLATE: /tmp/ag_config_template.yaml
            TRAIN_OUTPUT: "{{output}}"
          inputs:
            - url: "{{ dig_url_root }}/models/pretrained"
            - url: "{{ dig_url_root }}/datasets/{{ usecase }}/raw"
          command: ["bash"]
          args: ["/tmp/anomalygen_train.sh"]
          files:
            - localpath: ../cookbooks/{{ usecase }}/ag_config.yaml
              path: /tmp/ag_config_template.yaml
            - localpath: ../../scripts/anomalygen_train.sh
              path: /tmp/anomalygen_train.sh
          outputs:
            - url: "{{ dig_url_root }}/runs/{{ name }}/finetune"

default-values:
  workflow_name: finetune
  exec_timeout: 28h
  queue_timeout: 2h
  dig_url_root: "s3://osmo-workflows/dig"
  usecase: pcb
  anomalygen_image: "nvcr.io/nvidia/paidf-anomalygen:1.1.0"
  train_gpu: "1"
  train_cpu: "16"
  train_memory: 96Gi
  train_storage: 300Gi
  platform: default
